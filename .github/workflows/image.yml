# SPDX-License-Identifier: 0BSD
# Build, test and publish the image to ghcr.io/<owner>/s2tool.
# Pull requests only build and test; pushes to main also publish.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/s2tool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 test_s2tool.py

      - name: Toolchain tag
        id: toolchain
        # e.g. wine11.0.0.0-dxvk3.1.1-s2v20.1-rcv1.0.0
        run: |
          v() { sed -nE "s/^ARG $1=(.*)/\1/p" Containerfile; }
          echo "tag=wine$(v WINE_VERSION | cut -d~ -f1)-dxvk$(v DXVK_VERSION)-s2v$(v S2V_VERSION)-rc$(v RESCOMP_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.toolchain.outputs.tag }},enable={{is_default_branch}}
            type=sha
          # The repo's 0BSD covers only its own files; the image bundles other licenses (README "Notice").
          labels: |
            org.opencontainers.image.title=s2tool
            org.opencontainers.image.description=Source 2 toolchain: Source2Viewer decompile + Valve resourcecompiler under Wine. Bundles Valve's Workshop Tools; see the README Notice.
            org.opencontainers.image.licenses=0BSD AND LGPL-2.1-or-later AND MIT AND Zlib AND LicenseRef-Valve-Workshop-Tools

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          tags: s2tool:test
          labels: ${{ steps.meta.outputs.labels }}
          # single manifest, no attestations: keeps GHCR free of untagged helper versions (see prune-ghcr.sh)
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ENGINE=docker IMAGE=s2tool:test ./smoke-test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
